name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: gofmt -l . | tee /tmp/fmt && ! test -s /tmp/fmt
      - run: go vet ./...
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      - run: govulncheck ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o mlai-bridge .

  # The Windows build is the one most users run: test it there, then start the
  # packaged executable (startup, discovery, status, direct-only refusal, and a
  # killed bridge leaving no trusted discovery file).
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - name: Smoke-test the Windows executable
        shell: pwsh
        run: ./scripts/windows-smoke.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Build binaries
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.packageVersion=${GITHUB_REF_NAME#v}" \
              -o "dist/mlai-bridge_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Build binaries
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X main.packageVersion=${GITHUB_REF_NAME#v}" \
              -o "dist/mlai-bridge_${os}_${arch}${ext}" .
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11
      - name: Build npm packages
        run: node scripts/npm-build.mjs "${GITHUB_REF_NAME#v}" dist > "$RUNNER_TEMP/npm-dirs.txt"
      # No token: npm trusts this workflow (Trusted Publishing, set per package on npmjs.com).
      - name: Publish npm packages
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac # prereleases never become "latest"
          while read -r dir; do
            name=$(node -p "require('$dir/package.json').name")
            version=$(node -p "require('$dir/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published; skipping"
              continue
            fi
            (cd "$dir" && npm publish --access public --provenance --tag "$tag")
          done < "$RUNNER_TEMP/npm-dirs.txt"
