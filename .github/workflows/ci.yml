name: ci

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - run: gofmt -l . | tee /tmp/fmt && ! test -s /tmp/fmt
      - run: go vet ./...
      - run: go test -race ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o mlai-bridge .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Build binaries
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags '-s -w' \
              -o "dist/mlai-bridge_${os}_${arch}${ext}" .
          done
          cd dist && sha256sum * > checksums.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: dist/*

  npm:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.26"
      - name: Build binaries
        run: |
          mkdir -p dist
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${t%/*}; arch=${t#*/}; ext=""
            [ "$os" = windows ] && ext=".exe"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags '-s -w' \
              -o "dist/mlai-bridge_${os}_${arch}${ext}" .
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Build npm packages
        run: node scripts/npm-build.mjs "${GITHUB_REF_NAME#v}" dist > "$RUNNER_TEMP/npm-dirs.txt"
      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tag=latest
          case "$GITHUB_REF_NAME" in *-*) tag=next ;; esac # prereleases never become "latest"
          while read -r dir; do
            (cd "$dir" && npm publish --access public --provenance --tag "$tag")
          done < "$RUNNER_TEMP/npm-dirs.txt"
